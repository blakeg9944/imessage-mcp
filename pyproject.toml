[project]
name = "imessage-mcp"
version = "0.1.0"
description = "MCP server for scheduling ward interviews over iMessage/SMS (dry-run by default)"
requires-python = ">=3.10"
dependencies = [
    # FastMCP lives at mcp.server.fastmcp in the 1.x SDK; 2.x renamed it to MCPServer.
    "mcp>=1.2,<2",
    "pytypedstream>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["imessage_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
